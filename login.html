<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Ikawa House</title>
  <link rel="stylesheet" href="Style.css">
</head>
<body data-page="login">
  <nav>
    <div class="logo">
      <img src="logo.svg" alt="Ikawa House Logo">
      <span class="site-name">Ikawa House</span>
    </div>
  </nav>

  <section>
    <h2>Log In</h2>
    <form id="login-form">
      <label for="email">Email:</label>
      <input type="email" id="email" required>
      <label for="password">Password:</label>
      <input type="password" id="password" required>
      <button class="order-btn full" type="submit">Log In</button>
      <p class="center sm">No account yet? <a href="register.html">Register</a></p>
    </form>
  </section>
  <footer>
    <p>📍 KK 311 St, Kicukiro, Kigali | 📞 +250 794 388 164 | ✉️ info@coffeeandsnacks.com</p>
    <p>&copy; 2026 Ikawa House. All rights reserved.</p>
  </footer>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
